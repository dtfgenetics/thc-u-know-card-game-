name: Deploy THC U Know Node runtime

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact main commit to deploy; leave blank for current main
        required: false
        type: string
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: thc-u-know-node-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    environment: production
    env:
      SSH_HOST: ${{ secrets.THC_U_KNOW_SSH_HOST }}
      SSH_USER: ${{ secrets.THC_U_KNOW_SSH_USER }}
      SSH_PORT: ${{ secrets.THC_U_KNOW_SSH_PORT }}
      SSH_KEY: ${{ secrets.THC_U_KNOW_SSH_KEY }}
      SERVER_ORIGIN: ${{ vars.THC_U_KNOW_SERVER_ORIGIN }}
      APP_PORT: ${{ vars.THC_U_KNOW_PORT || '5174' }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve exact green release
        id: release
        shell: bash
        env:
          REQUESTED_SHA: ${{ github.event.inputs.release_sha || '' }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha || '' }}
        run: |
          set -euo pipefail
          requested="$REQUESTED_SHA"
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_run' ]]; then
            requested="$VERIFIED_SHA"
          fi
          if [[ -z "$requested" ]]; then
            requested="$(git rev-parse HEAD)"
          fi
          [[ "$requested" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "release SHA must be a full commit SHA" >&2; exit 1; }
          git fetch origin "$requested"
          sha="$(git rev-parse "$requested^{commit}")"
          git merge-base --is-ancestor "$sha" origin/main || { echo "release SHA is not contained in main" >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Resolved exact release $sha"

      - name: Require production hosting configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in SSH_HOST SSH_USER SSH_KEY SERVER_ORIGIN; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error title=THC U Know Node deployment blocked::Missing production configuration: $(IFS=,; echo "${missing[*]}")."
            exit 1
          fi
          node -e "new URL(process.env.SERVER_ORIGIN)"
          [[ "$APP_PORT" =~ ^[0-9]+$ ]] || { echo "THC_U_KNOW_PORT must be numeric" >&2; exit 1; }

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          port="${SSH_PORT:-22}"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_thc_u_know"
          chmod 600 "$HOME/.ssh/id_thc_u_know"
          ssh-keyscan -p "$port" -H "$SSH_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Deploy exact release
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          port="${SSH_PORT:-22}"
          ssh -p "$port" -i "$HOME/.ssh/id_thc_u_know" "$SSH_USER@$SSH_HOST" \
            "bash -s -- '$RELEASE_SHA' '$APP_PORT'" <<'REMOTE'
          set -euo pipefail
          release_sha="$1"
          app_port="$2"
          deploy_dir="$HOME/apps/thc-u-know"

          for command in git node corepack curl; do
            command -v "$command" >/dev/null 2>&1 || {
              echo "Required command is missing on production host: $command" >&2
              exit 1
            }
          done

          mkdir -p "$HOME/apps"
          if [[ ! -d "$deploy_dir/.git" ]]; then
            git clone https://github.com/dtfgenetics/thc-u-know-card-game-.git "$deploy_dir"
          fi

          cd "$deploy_dir"
          git fetch --prune origin main
          git cat-file -e "$release_sha^{commit}"
          git checkout --detach "$release_sha"
          git reset --hard "$release_sha"

          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm install --frozen-lockfile
          pnpm verify
          pnpm test:production-runtime

          umask 077
          cat > .env.production <<EOF
          NODE_ENV=production
          PORT=$app_port
          WEB_ORIGIN=https://dtfseeds.com,https://www.dtfseeds.com
          WEB_BASE_PATH=/games/thc-u-know
          WEB_DIST_DIR=apps/web/dist
          SOCKET_IO_PATH=/games/thc-u-know/socket.io
          SESSION_STORE=memory
          ENABLE_REDIS_ADAPTER=false
          EOF
          chmod 600 .env.production
          chmod +x deploy/start-production.sh

          if command -v pm2 >/dev/null 2>&1; then
            pm2 delete thc-u-know >/dev/null 2>&1 || true
            pm2 start deploy/start-production.sh --name thc-u-know --cwd "$deploy_dir"
            pm2 save
          elif systemctl --user --version >/dev/null 2>&1; then
            mkdir -p "$HOME/.config/systemd/user"
            cat > "$HOME/.config/systemd/user/thc-u-know.service" <<EOF
          [Unit]
          Description=THC U Know Node multiplayer runtime
          After=network.target

          [Service]
          Type=simple
          WorkingDirectory=$deploy_dir
          ExecStart=$deploy_dir/deploy/start-production.sh
          Restart=always
          RestartSec=3

          [Install]
          WantedBy=default.target
          EOF
            systemctl --user daemon-reload
            systemctl --user enable --now thc-u-know.service
            systemctl --user restart thc-u-know.service
          else
            echo "Production host needs PM2 or a usable user systemd instance for persistent process supervision." >&2
            exit 1
          fi

          for attempt in $(seq 1 30); do
            if curl --fail --silent "http://127.0.0.1:$app_port/games/thc-u-know/healthz" | grep -q '"service":"thc-u-know-server"'; then
              echo "Local THC U Know Node health is ready"
              exit 0
            fi
            sleep 2
          done

          echo "THC U Know Node runtime did not become healthy" >&2
          exit 1
          REMOTE

      - name: Verify configured public Node origin
        shell: bash
        run: |
          set -euo pipefail
          origin="${SERVER_ORIGIN%/}"
          health="$origin/games/thc-u-know/healthz"
          socket="$origin/games/thc-u-know/socket.io/?EIO=4&transport=polling&t=$RANDOM"
          health_body="$(curl --fail --silent --show-error --retry 8 --retry-delay 3 "$health")"
          echo "$health_body" | grep -q '"service":"thc-u-know-server"'
          socket_body="$(curl --fail --silent --show-error --retry 8 --retry-delay 3 "$socket")"
          [[ "$socket_body" == 0\{* ]] || { echo "Socket.IO public handshake did not return an Engine.IO open packet" >&2; exit 1; }
          echo "Verified public Node runtime at $origin"

      - name: Remove SSH material
        if: always()
        run: rm -f "$HOME/.ssh/id_thc_u_know"
