name: Verify THC U Know Live Runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/check-live.mjs'
      - '.github/workflows/verify-live-runtime.yml'
  workflow_run:
    workflows: ["Deploy THC U Know Node runtime"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: verify-thc-u-know-live
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate live checker
        run: node --check scripts/check-live.mjs

      - name: Verify production route, health and Socket.IO
        run: npm run live:check

      - name: Summarize
        if: always()
        run: |
          {
            echo '## THC U Know live runtime verification'
            echo
            echo '- Web: https://dtfseeds.com/games/thc-u-know/'
            echo '- Default topology: same-origin Node health and Socket.IO under https://dtfseeds.com/games/thc-u-know/.'
            echo '- Optional split-origin: set LIVE_SERVER_URL / THC_U_KNOW_SERVER_ORIGIN to the deployed Node origin.'
            echo '- Requires the canonical Header V6 DTFSeeds navigation and thc-u-know-server identity.'
            echo '- A green run is still followed by the manual two-browser multiplayer gate before public promotion.'
          } >> "$GITHUB_STEP_SUMMARY"
