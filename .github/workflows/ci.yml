name: THC U Know CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm -r lint

      - name: Build
        run: pnpm -r build

      - name: Test shared game rules
        run: pnpm test

      - name: Verify production runtime contract
        run: pnpm test:production-runtime

      - name: Validate runtime manifest
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const contract = JSON.parse(fs.readFileSync('deploy/runtime-contract.json', 'utf8'));
          if (contract.webRoute !== '/games/thc-u-know/') throw new Error('Unexpected web route');
          if (contract.socketPath !== '/games/thc-u-know/socket.io') throw new Error('Unexpected Socket.IO path');
          if (contract.staticOnlyDeploymentSupported !== false) throw new Error('Static-only deployment must remain prohibited');
          if (!contract.requiresWebSocketUpgrade) throw new Error('WebSocket upgrade requirement must remain explicit');
          NODE

      - name: Install Playwright browser
        run: pnpm --filter @thc-u-know/web exec playwright install --with-deps chromium

      - name: Multiplayer end-to-end test
        run: pnpm --filter @thc-u-know/web test:e2e
