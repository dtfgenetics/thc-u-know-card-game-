name: Live Production Smoke

on:
  workflow_dispatch:
    inputs:
      live_base_url:
        description: Public frontend origin to test
        required: true
        default: https://dtfseeds.com
        type: string
      live_server_url:
        description: Optional Node/Socket.IO origin when backend is hosted separately
        required: false
        default: ''
        type: string
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Probe production frontend, health routes, and Socket.IO handshake
        env:
          LIVE_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.live_base_url || 'https://dtfseeds.com' }}
          LIVE_SERVER_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.live_server_url || vars.THC_U_KNOW_SERVER_ORIGIN || '' }}
        run: pnpm live:check
